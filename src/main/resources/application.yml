server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true
  tomcat:
    remote-ip-header: x-forwarded-for
    protocol-header: x-forwarded-proto

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import: optional:file:src/main/resources/secret.properties

  application:
    name: 42cabi-gyeongsan

  task:
    scheduling:
      thread-name-prefix: scheduling-
      pool:
        size: ${SCHEDULER_POOL_SIZE:5}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never
      encoding: UTF-8

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:cabi}?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&useSSL=true&trustServerCertificate=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: CabiHikariPool
      maximum-pool-size: 30
      minimum-idle: 15
      connection-timeout: 30000
      initialization-fail-timeout: 0
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      leak-detection-threshold: 15000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  security:
    oauth2:
      client:
        registration:
          42:
            client-id: ${FT_CLIENT_ID}
            client-secret: ${FT_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${FRONTEND_URL}/login/oauth2/code/42"
            scope: public
            client-name: 42 gyeongsan
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${FRONTEND_URL}/login/oauth2/code/kakao"
            scope: account_email
            client-name: Kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "${FRONTEND_URL}/login/oauth2/code/google"
            scope: profile,email
        provider:
          42:
            authorization-uri: https://api.intra.42.fr/oauth/authorize
            token-uri: https://api.intra.42.fr/oauth/token
            user-info-uri: https://api.intra.42.fr/v2/me
            user-name-attribute: login
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

cabinet:
  policy:
    lent-term: 31
    extension-term: 3
  items:
    extension-price: 400
    swap-price: 1000
    penalty-exemption-price: 300

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    groups-order: desc
    disable-swagger-default-url: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, graphics, metrics, prometheus
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 1800000
  refresh-token-validity: 1209600000

auth:
  allowed-email-domain: 42gyeongsan.kr

slack:
  token: ${SLACK_BOT_TOKEN}
  http:
    connect-timeout-ms: ${SLACK_HTTP_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${SLACK_HTTP_READ_TIMEOUT_MS:5000}

ai:
  server:
    url: ${AI_SERVER_URL:http://ai:8000}

app:
  redis:
    allow-insecure: ${REDIS_ALLOW_INSECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  client:
    connect-timeout: 20000
    read-timeout: 20000
  frontend:
    url: ${FRONTEND_URL}
  ft-api:
    root-url: https://api.intra.42.fr
    token-url: https://api.intra.42.fr/oauth/token
  rate-limit:
    auth:
      reissue-per-minute: ${AUTH_REISSUE_LIMIT_PER_MINUTE:20}
      link-per-minute: ${AUTH_LINK_LIMIT_PER_MINUTE:10}
  slack-report:
    enabled: ${SLACK_REPORT_FORWARD_ENABLED:false}
    channel-id: ${SLACK_REPORT_CHANNEL_ID:}
    poll-interval-ms: ${SLACK_REPORT_POLL_INTERVAL_MS:60000}
    max-per-poll: 20
  kakao-notify:
    enabled: ${KAKAO_NOTIFY_ENABLED:false}
    enc-key: ${KAKAO_TOKEN_ENC_KEY:}
  slack-notice:
    enabled: ${SLACK_NOTICE_FORWARD_ENABLED:false}
    channel-id: ${SLACK_NOTICE_CHANNEL_ID:}
    poll-interval-ms: ${SLACK_NOTICE_POLL_INTERVAL_MS:60000}
    link-url: ${SLACK_NOTICE_LINK_URL:${FRONTEND_URL:}}
    permalink-enabled: ${SLACK_NOTICE_PERMALINK_ENABLED:false}
    summary:
      enabled: ${SLACK_NOTICE_SUMMARY_ENABLED:false}
      api-key: ${GEMINI_API_KEY:}
      model: ${SLACK_NOTICE_SUMMARY_MODEL:gemini-3.6-flash}
      thinking-level: ${SLACK_NOTICE_SUMMARY_THINKING_LEVEL:low}
      timeout: ${SLACK_NOTICE_SUMMARY_TIMEOUT:8s}
      circuit-breaker:
        sliding-window-size: 5
        minimum-calls: 3
        failure-rate-threshold: 50
        wait-in-open-state: 10m
    max-per-poll: 5
    max-hold-hours: 24
  chatbot:
    enabled: ${CHATBOT_ENABLED:false}
    match-threshold: ${CHATBOT_MATCH_THRESHOLD:0.93}
    suggest-threshold: ${CHATBOT_SUGGEST_THRESHOLD:0.88}
    match-margin: ${CHATBOT_MATCH_MARGIN:0.02}
    match-alternatives: ${CHATBOT_MATCH_ALTERNATIVES:2}
    max-suggestions: 3
    personal:
      enabled: ${CHATBOT_PERSONAL_ENABLED:false}
      rate-limit-per-minute: ${CHATBOT_PERSONAL_RATE_PER_MINUTE:10}
    max-question-length: 200
    max-concurrent-embeddings: 2
    reload-interval-ms: 30000
    fallback-message: "비슷한 FAQ 를 찾지 못했어요. 홈페이지 공지의 연락처나 오류제보 채널로 문의해 주세요."
    embedding:
      provider: ${CHATBOT_EMBEDDING_PROVIDER:onnx}
      model-id: ${CHATBOT_MODEL_ID:unknown}
      model-dir: ${CHATBOT_MODEL_DIR:/app/chatbot-model}
      model-file: ${CHATBOT_MODEL_FILE:model.onnx}
      tokenizer-file: ${CHATBOT_TOKENIZER_FILE:tokenizer.json}
      prefix: ${CHATBOT_EMBEDDING_PREFIX:}
      max-tokens: ${CHATBOT_MAX_TOKENS:0}
      threads: ${CHATBOT_EMBEDDING_THREADS:2}
  reward:
    lent-ticket:
      default-threshold-minutes: ${LENT_TICKET_THRESHOLD_MINUTES:4800}
      transcender-threshold-minutes: ${LENT_TICKET_TRANSCENDER_THRESHOLD_MINUTES:900}

resilience4j:
  circuitbreaker:
    instances:
      aiServer:
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        slidingWindowSize: 5
  ratelimiter:
    instances:
      ftApi:
        limitForPeriod: 5
        limitRefreshPeriod: 1s
        timeoutDuration: 5s
      userApi:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 0s
      chatbotApi:
        limitForPeriod: 20
        limitRefreshPeriod: 1s
        timeoutDuration: 0s
      lentApi:
        limitForPeriod: 30
        limitRefreshPeriod: 1s
        timeoutDuration: 0s

cloud:
  azure:
    storage:
      blob:
        container-name: locker-images
        connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
