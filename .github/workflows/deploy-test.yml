name: 🚀 Deploy to Test (GHCR → Azure App Service)


on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/farmer0010/ft_cabinet_be-v2
  AZURE_WEBAPP_NAME: subak-server-test
  AZURE_RESOURCE_GROUP: 42-Cabinet-Test-RG

jobs:
  build-and-push:
    if: github.repository == 'farmer0010/ft_cabinet_BE-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle

      - name: 🔨 Build jar (bootJar)
        run: ./gradlew bootJar --no-daemon

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          build-args: |
            CHATBOT_MODEL=e5
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.repository == 'farmer0010/ft_cabinet_BE-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: 🔎 Check required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Secret ${name} 가 비어 있거나 등록되지 않았습니다."
              missing=1
            fi
          done
          exit "$missing"

      - name: 🔐 Azure login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: 🎯 Verify deploy target (read-only)
        run: |
          set -euo pipefail
          actual_rg="$(az webapp show \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query resourceGroup -o tsv)"
          if [ "${actual_rg,,}" != "${AZURE_RESOURCE_GROUP,,}" ]; then
            echo "::error::대상 App Service 의 리소스 그룹이 예상과 다릅니다. 배포를 중단합니다."
            exit 1
          fi
          echo "대상 확인: ${AZURE_WEBAPP_NAME} (${AZURE_RESOURCE_GROUP})"

      - name: 🔄 Update container image
        run: |
          set -euo pipefail
          az webapp config container set \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --container-image-name "${IMAGE_NAME}:${GITHUB_SHA}" \
            --container-registry-url https://ghcr.io

      - name: 🧾 Show configured image
        run: |
          az webapp config show \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query linuxFxVersion -o tsv
