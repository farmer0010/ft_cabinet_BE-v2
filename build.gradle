plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.42gyeongsan'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	asciidoctorExt {
		extendsFrom testImplementation
	}
}

ext {
	set('snippetsDir', file('build/generated-snippets'))
	set('springCloudVersion', "2025.0.0")
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
		mavenBom "com.azure.spring:spring-cloud-azure-dependencies:5.19.0"
	}
}

tasks.named('test') {
	outputs.dir snippetsDir
	useJUnitPlatform()
}

dependencies {
	implementation 'org.apache.commons:commons-lang3:3.18.0'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'

	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'net.javacrumbs.shedlock:shedlock-spring:5.10.0'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-redis-spring:5.10.0'
	implementation 'com.drewnoakes:metadata-extractor:2.18.0'

	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
	implementation 'com.azure.spring:spring-cloud-azure-starter-storage-blob'

	// 챗봇(FAQ 의미 검색)의 서버 내부 임베딩: ONNX 모델 실행 + HuggingFace 토크나이저. 둘 다 네이티브 라이브러리를 jar 안에 포함한다.
	implementation 'com.microsoft.onnxruntime:onnxruntime:1.30.0'
	implementation 'ai.djl.huggingface:tokenizers:0.38.0'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy 'jacocoTestReport'
}

// 실제 재학생 인트라 ID 가 들어 있는 시드(src/main/resources/data.sql)는 어떤 산출물에도 넣지 않는다.
// 이 파일은 jar 와 공개 컨테이너 이미지에 그대로 실려 나갔다(감사 H-5). 클래스패스(jar, bootRun)에서 빼고,
// 테스트는 src/test/resources/data.sql(가짜 데이터), 로컬/데모는 scripts/db/seed/demo-seed.sql(가짜 데이터)을 쓴다.
// 파일을 저장소에서 어떻게 제거할지(히스토리 포함 여부)는 별도로 결정한다.
processResources {
	exclude 'data.sql'
}

// 위 제외가 풀리거나 다른 경로로 들어오면 빌드가 실패하도록, 만들어진 jar 안을 직접 검사한다.
def assertNoSeedData = { File archive ->
	new java.util.zip.ZipFile(archive).withCloseable { zip ->
		def leaked = zip.entries().toList().findAll { it.name == 'data.sql' || it.name.endsWith('/data.sql') }
		if (!leaked.isEmpty()) {
			throw new GradleException("${archive.name} 에 시드 파일이 들어 있습니다: ${leaked*.name}. 실제 인트라 ID 가 배포물에 실리면 안 됩니다.")
		}
	}
}
tasks.named('bootJar') {
	doLast { assertNoSeedData(archiveFile.get().asFile) }
}
tasks.named('jar') {
	doLast { assertNoSeedData(archiveFile.get().asFile) }
}

spotless {
	java {
		target '**/*.java'
		googleJavaFormat().aosp()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

jacoco {
	toolVersion = "0.8.12"
}

jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
		xml.required = true
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'**/dto/**',
				'**/config/**',
				'**/global/**',
				'**/exception/**',
				'**/adapter/in/web/**',
				'**/*Application*',
			])
		}))
	}
	finalizedBy 'jacocoTestCoverageVerification'
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			element = 'CLASS'
			includes = [
				'com.gyeongsan.cabinet.domain.user.model.User',
				'com.gyeongsan.cabinet.domain.cabinet.model.Cabinet',
				'com.gyeongsan.cabinet.domain.admin.service.AdminUserService',
				'com.gyeongsan.cabinet.domain.admin.service.AdminCabinetService'
			]
			limit {
				counter = 'INSTRUCTION'
				value = 'COVEREDRATIO'
				minimum = 0.20
			}
		}
	}
}
